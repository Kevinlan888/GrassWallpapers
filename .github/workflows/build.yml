name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build GrassWallpapers
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install build utilities
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xxd zip

      - name: Prepare Android SDK
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$SDKMANAGER" ]]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -n 1)"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses > /dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install \
            "platforms;android-35" \
            "build-tools;36.0.0" \
            "ndk;27.2.12479018"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Build APK
        run: |
          chmod +x build_vulkan_spike.sh
          ./build_vulkan_spike.sh

      - name: Generate checksum
        run: |
          cd dist
          sha256sum GrassWallpapers.apk > GrassWallpapers.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GrassWallpapers-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            dist/GrassWallpapers.apk
            dist/GrassWallpapers.apk.sha256
          if-no-files-found: error
          retention-days: 30
